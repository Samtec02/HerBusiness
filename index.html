<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>HerBusiness · manage your business</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: #f7f5fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }
        #app {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06), 0 6px 12px rgba(0,0,0,0.03);
            overflow: hidden;
            position: relative;
            min-height: 780px;
            display: flex;
            flex-direction: column;
        }
        #setupOverlay {
            position: absolute;
            inset: 0;
            background: #ffffff;
            z-index: 1000;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 32px;
            transition: opacity 0.3s;
        }
        #setupOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .setup-title {
            font-size: 28px;
            font-weight: 600;
            color: #1e192b;
            margin-bottom: 4px;
        }
        .setup-sub {
            color: #6b5f7a;
            margin-bottom: 28px;
            font-size: 16px;
        }
        .setup-field {
            margin-bottom: 18px;
        }
        .setup-field label {
            display: block;
            font-weight: 500;
            color: #2e253a;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .setup-field input,
        .setup-field select {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e3dcec;
            border-radius: 18px;
            font-size: 16px;
            background: #faf8fd;
            transition: 0.2s;
        }
        .setup-field input:focus,
        .setup-field select:focus {
            outline: none;
            border-color: #b198d4;
            background: white;
        }
        .setup-field select {
            appearance: auto;
            cursor: pointer;
        }
        .btn-primary {
            background: #5f3d8a;
            border: none;
            color: white;
            padding: 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 17px;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(95, 61, 138, 0.25);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: #f0ebf7;
            border: none;
            color: #3f2a5e;
            padding: 14px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .btn-secondary:active {
            transform: scale(0.96);
        }
        .btn-success {
            background: #d9f0e1;
            border: none;
            color: #1d6f44;
            padding: 14px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .btn-success:active {
            transform: scale(0.96);
        }
        .btn-danger {
            background: #fce4e4;
            border: none;
            color: #b13e3e;
            padding: 14px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .btn-danger:active {
            transform: scale(0.96);
        }
        .main-content {
            flex: 1;
            padding: 20px 18px 80px;
            overflow-y: auto;
            display: none;
        }
        .main-content.active {
            display: block;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .logo-container {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f0ebf7;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px dashed #d4c8e0;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .logo-container:hover {
            border-color: #5f3d8a;
            background: #e8dff2;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-container .logo-placeholder {
            font-size: 20px;
            color: #b198d4;
            font-weight: 300;
            text-align: center;
            line-height: 1.2;
            padding: 4px;
        }
        .logo-container .logo-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.2s;
            border-radius: 50%;
            color: white;
            font-size: 11px;
            text-align: center;
            padding: 4px;
        }
        .logo-container:hover .logo-overlay {
            opacity: 1;
        }
        .greeting {
            flex: 1;
            min-width: 0;
        }
        .greeting h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1a1425;
        }
        .greeting p {
            color: #6b5f7a;
            font-size: 14px;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .business-badge {
            background: #f0ebf7;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 13px;
            color: #3f2a5e;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .business-badge:hover {
            background: #e5daf2;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0 18px;
        }
        .stat-card {
            background: #faf8fd;
            border-radius: 24px;
            padding: 14px 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid #f0ebf7;
        }
        .stat-card .label {
            font-size: 12px;
            font-weight: 500;
            color: #7b6e8a;
            letter-spacing: 0.3px;
        }
        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
            color: #1e142b;
            margin-top: 4px;
        }
        .stat-card .sub {
            font-size: 13px;
            color: #7b6e8a;
            margin-top: 4px;
        }
        .stat-card .profit-positive {
            color: #1d6f44;
        }
        .stat-card .profit-negative {
            color: #b13e3e;
        }
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 18px 0 22px;
        }
        .quick-btn {
            background: #f5f1fb;
            border-radius: 40px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #2f1f44;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            transition: 0.15s;
            flex: 1 0 auto;
            justify-content: center;
        }
        .quick-btn i {
            color: #5f3d8a;
        }
        .quick-btn:active {
            background: #e5daf2;
        }
        .chart-placeholder {
            background: #faf8fd;
            border-radius: 28px;
            padding: 16px 12px;
            border: 1px solid #eee8f5;
            margin: 10px 0 16px;
            text-align: center;
            color: #6b5f7a;
            font-size: 14px;
        }
        .chart-bars {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 80px;
            margin-top: 8px;
        }
        .bar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .bar {
            width: 24px;
            background: #b198d4;
            border-radius: 12px 12px 6px 6px;
            height: 20px;
            transition: 0.3s;
        }
        .bar-label {
            font-size: 10px;
            color: #5f4f72;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .screen-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .screen-title .badge-count {
            font-size: 14px;
            font-weight: 500;
            color: #6b5f7a;
            background: #f0ebf7;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .list-item {
            background: #faf8fd;
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 8px;
            border: 1px solid #ede7f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-item .info {
            font-size: 14px;
            flex: 1;
        }
        .list-item .info strong {
            display: block;
            color: #1e142b;
        }
        .list-item .info .meta {
            font-size: 12px;
            color: #7b6e8a;
        }
        .list-item .info .meta .profit-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 4px;
        }
        .profit-badge.positive {
            background: #d9f0e1;
            color: #1d6f44;
        }
        .profit-badge.negative {
            background: #fce4e4;
            color: #b13e3e;
        }
        .stock-badge.in-stock {
            background: #d9f0e1;
            color: #1d6f44;
        }
        .stock-badge.low-stock {
            background: #fce9d4;
            color: #a8662c;
        }
        .stock-badge.out-of-stock {
            background: #fce4e4;
            color: #b13e3e;
        }
        .badge {
            background: #e6def0;
            border-radius: 60px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            color: #3f2a5e;
        }
        .badge.warning {
            background: #fce9d4;
            color: #a8662c;
        }
        .badge.success {
            background: #d9f0e1;
            color: #1d6f44;
        }
        .badge.info {
            background: #d4e4f7;
            color: #1a4f7a;
        }
        .badge.danger {
            background: #fce4e4;
            color: #b13e3e;
        }
        .fab {
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: #5f3d8a;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 14px 22px;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(95, 61, 138, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 20;
            cursor: pointer;
            transition: 0.15s;
        }
        .fab:active {
            transform: scale(0.94);
        }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px 8px 14px;
            background: white;
            border-top: 1px solid #ede7f5;
            position: sticky;
            bottom: 0;
            z-index: 30;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #8d7e9e;
            background: transparent;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            transition: 0.1s;
            gap: 2px;
        }
        .nav-item i {
            font-size: 20px;
        }
        .nav-item.active {
            color: #5f3d8a;
            font-weight: 500;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-overlay.open {
            visibility: visible;
            opacity: 1;
        }
        .modal-card {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 32px 32px 0 0;
            padding: 28px 20px 40px;
            transform: translateY(20px);
            transition: 0.25s;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-overlay.open .modal-card {
            transform: translateY(0);
        }
        .modal-card h3 {
            font-size: 20px;
            margin-bottom: 16px;
        }
        .modal-field {
            margin-bottom: 14px;
        }
        .modal-field label {
            font-size: 13px;
            font-weight: 500;
            display: block;
            margin-bottom: 4px;
            color: #2e253a;
        }
        .modal-field input,
        .modal-field select,
        .modal-field textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e3dcec;
            border-radius: 16px;
            background: #faf8fd;
            font-size: 15px;
        }
        .modal-field textarea {
            min-height: 60px;
        }
        .modal-field .logo-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px dashed #b198d4;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px auto;
            overflow: hidden;
            background: #faf8fd;
        }
        .modal-field .logo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal-field .logo-preview .placeholder {
            color: #8d7e9e;
            font-size: 12px;
            text-align: center;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .modal-actions button {
            flex: 1;
            padding: 14px;
            border-radius: 60px;
            border: none;
            font-weight: 600;
        }
        .btn-outline {
            background: #f0ebf7;
            color: #3f2a5e;
        }
        .toast {
            position: fixed;
            bottom: 130px;
            left: 20px;
            right: 20px;
            background: #1e142b;
            color: white;
            padding: 14px 18px;
            border-radius: 60px;
            text-align: center;
            font-weight: 500;
            z-index: 300;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            max-width: 400px;
            margin: 0 auto;
        }
        .toast.show {
            opacity: 1;
        }
        .ad-placeholder {
            background: #f3eff8;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            color: #7b6e8a;
            font-size: 12px;
            margin: 16px 0 6px;
            border: 1px dashed #c9bcdb;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mt-2 {
            margin-top: 12px;
        }
        .mb-1 {
            margin-bottom: 6px;
        }
        .text-center {
            text-align: center;
        }
        .empty-state {
            color: #8d7e9e;
            padding: 30px 10px;
            text-align: center;
        }
        .progress-bar {
            height: 10px;
            background: #ede7f5;
            border-radius: 20px;
            margin: 8px 0 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #5f3d8a;
            border-radius: 20px;
        }
        .backup-section {
            background: #faf8fd;
            border-radius: 24px;
            padding: 16px;
            border: 2px dashed #b198d4;
            margin: 12px 0;
        }
        .backup-section .label {
            font-weight: 600;
            color: #3f2a5e;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .backup-section .label i {
            color: #5f3d8a;
        }
        .report-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0;
        }
        .logo-upload-btn {
            background: #5f3d8a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 8px;
        }
        .logo-upload-btn:active {
            transform: scale(0.96);
        }
        .remove-logo-btn {
            background: #fce4e4;
            color: #b13e3e;
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 8px;
        }
        .remove-logo-btn:active {
            transform: scale(0.96);
        }
        .product-select {
            padding: 12px 14px;
            border: 1.5px solid #e3dcec;
            border-radius: 16px;
            background: #faf8fd;
            font-size: 15px;
            width: 100%;
        }
        .product-select:focus {
            outline: none;
            border-color: #b198d4;
            background: white;
        }
        .profit-summary {
            background: #f5f1fb;
            border-radius: 16px;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ede7f5;
        }
        .profit-summary .label {
            font-size: 12px;
            color: #7b6e8a;
        }
        .profit-summary .value {
            font-size: 18px;
            font-weight: 700;
        }
        .currency-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 8px 0;
        }
        .currency-option {
            padding: 10px 8px;
            border: 2px solid #e3dcec;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #faf8fd;
            font-weight: 500;
            font-size: 14px;
        }
        .currency-option:hover {
            border-color: #b198d4;
            background: #f0ebf7;
        }
        .currency-option.selected {
            border-color: #5f3d8a;
            background: #f0ebf7;
            color: #5f3d8a;
        }
        .report-type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 8px 0 12px 0;
        }
        .report-type-btn {
            padding: 12px 8px;
            border: 2px solid #e3dcec;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #faf8fd;
            font-weight: 500;
            font-size: 13px;
        }
        .report-type-btn:hover {
            border-color: #b198d4;
            background: #f0ebf7;
        }
        .report-type-btn.active {
            border-color: #5f3d8a;
            background: #5f3d8a;
            color: white;
        }
        .report-type-btn i {
            display: block;
            font-size: 20px;
            margin-bottom: 4px;
        }
        @media (min-width: 600px) {
            #app {
                max-width: 480px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="setupOverlay">
            <div style="margin-bottom: 8px;"><i class="fas fa-spa" style="font-size: 36px; color:#5f3d8a;"></i></div>
            <div class="setup-title">Welcome to HerBusiness 🌸</div>
            <div class="setup-sub">Let's set up your business.</div>
            <div class="setup-field"><label>Business name</label><input id="setupBizName" placeholder="e.g. Ama's Beauty"></div>
            <div class="setup-field"><label>Owner's name</label><input id="setupOwner" placeholder="Your name"></div>
            <div class="setup-field"><label>Business type</label>
                <select id="setupBizType"><option>Fashion</option><option>Beauty</option><option>Food</option><option>Hairdressing</option><option>Cosmetics</option><option>Retail</option><option>Online business</option><option>Tailoring</option><option>Other</option></select>
            </div>
            <div class="setup-field">
                <label>Select your currency</label>
                <select id="setupCurrency">
                    <option value="GH₵">🇬🇭 Ghana Cedi (GH₵)</option>
                    <option value="$">🇺🇸 US Dollar ($)</option>
                    <option value="€">🇪🇺 Euro (€)</option>
                    <option value="£">🇬🇧 British Pound (£)</option>
                    <option value="₦">🇳🇬 Nigerian Naira (₦)</option>
                    <option value="KSh">🇰🇪 Kenyan Shilling (KSh)</option>
                    <option value="TSh">🇹🇿 Tanzanian Shilling (TSh)</option>
                    <option value="R">🇿🇦 South African Rand (R)</option>
                    <option value="UGX">🇺🇬 Ugandan Shilling (UGX)</option>
                    <option value="₵">🇬🇭 Ghana Cedi (₵)</option>
                    <option value="CFA">🇨🇲 CFA Franc (CFA)</option>
                    <option value="₹">🇮🇳 Indian Rupee (₹)</option>
                    <option value="¥">🇯🇵 Japanese Yen (¥)</option>
                    <option value="A$">🇦🇺 Australian Dollar (A$)</option>
                    <option value="C$">🇨🇦 Canadian Dollar (C$)</option>
                </select>
            </div>
            <button class="btn-primary" id="setupFinish">Start managing 🌱</button>
            <p style="font-size:12px; color:#8d7e9e; margin-top:16px;">Your data stays on your device.</p>
        </div>

        <div id="toast" class="toast">✅ Done</div>

        <div id="mainApp" class="main-content">
            <div class="header">
                <div class="header-left">
                    <div class="logo-container" id="logoContainer" onclick="openLogoModal()">
                        <div id="logoDisplay">
                            <span class="logo-placeholder" id="logoPlaceholder">+</span>
                        </div>
                        <div class="logo-overlay">Add<br>Logo</div>
                    </div>
                    <div class="greeting">

            // ---------- BACKUP SYSTEM ----------
            function backupData() {
                try {
                    const data = JSON.stringify(STORE);
                    localStorage.setItem('herbusiness_data', data);
                    sessionStorage.setItem('herbusiness_backup', data);
                    saveToIndexedDB(data);
                    return true;
                } catch (e) {
                    console.warn('Backup failed:', e);
                    return false;
                }
            }

            function saveToIndexedDB(data) {
                try {
                    const request = indexedDB.open('HerBusinessBackup', 1);
                    request.onupgradeneeded = function(e) {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('backup')) {
                            db.createObjectStore('backup', { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = function(e) {
                        const db = e.target.result;
                        const transaction = db.transaction(['backup'], 'readwrite');
                        const store = transaction.objectStore('backup');
                        store.put({ id: 'mainData', data: data, timestamp: Date.now() });
                        db.close();
                    };
                    request.onerror = function(e) {
                        console.warn('IndexedDB backup failed:', e);
                    };
                } catch (e) {
                    console.warn('IndexedDB not available:', e);
                }
            }

            function restoreFromBackup() {
                try {
                    let data = localStorage.getItem('herbusiness_data');
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed.settings && parsed.settings.bizName) {
                            Object.assign(STORE, parsed);
                            return true;
                        }
                    }
                    data = sessionStorage.getItem('herbusiness_backup');
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed.settings && parsed.settings.bizName) {
                            Object.assign(STORE, parsed);
                            localStorage.setItem('herbusiness_data', data);
                            return true;
                        }
                    }
                    return restoreFromIndexedDB();
                } catch (e) {
                    console.warn('Restore failed:', e);
                    return false;
                }
            }

            function restoreFromIndexedDB() {
                return new Promise((resolve) => {
                    try {
                        const request = indexedDB.open('HerBusinessBackup', 1);
                        request.onsuccess = function(e) {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains('backup')) {
                                db.close();
                                resolve(false);
                                return;
                            }
                            const transaction = db.transaction(['backup'], 'readonly');
                            const store = transaction.objectStore('backup');
                            const getRequest = store.get('mainData');
                            getRequest.onsuccess = function() {
                                if (getRequest.result && getRequest.result.data) {
                                    const parsed = JSON.parse(getRequest.result.data);
                                    if (parsed.settings && parsed.settings.bizName) {
                                        Object.assign(STORE, parsed);
                                        localStorage.setItem('herbusiness_data', getRequest.result.data);
                                        db.close();
                                        resolve(true);
                                        return;
                                    }
                                }
                                db.close();
                                resolve(false);
                            };
                            getRequest.onerror = function() {
                                db.close();
                                resolve(false);
                            };
                        };
                        request.onerror = function() {
                            resolve(false);
                        };
                    } catch (e) {
                        resolve(false);
                    }
                });
            }

            function loadData() {
                try {
                    const raw = localStorage.getItem('herbusiness_data');
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed.settings && parsed.settings.bizName) {
                            Object.assign(STORE, parsed);
                            return true;
                        }
                    }
                    return restoreFromBackup();
                } catch (e) {
                    console.warn('Load failed, attempting restore:', e);
                    return restoreFromBackup();
                }
            }

            function saveData() {
                backupData();
            }

            // ---------- PROFIT CALCULATION FUNCTIONS ----------
            function getDateStr(dateStr) {
                if (!dateStr) return '';
                return dateStr.slice(0, 10);
            }

            function getWeekStart() {
                const d = new Date();
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                d.setDate(diff);
                d.setHours(0, 0, 0, 0);
                return d;
            }

            function getMonthStart() {
                const d = new Date();
                d.setDate(1);
                d.setHours(0, 0, 0, 0);
                return d;
            }

            function calculateSaleProfit(sale) {
                const product = STORE.products.find(p => p.id === sale.productId);
                if (product) {
                    const cost = product.buyPrice * sale.qty;
                    const profit = sale.total - cost;
                    return { cost, profit };
                }
                return { cost: 0, profit: 0 };
            }

            function getDailySalesProfit(date) {
                const daySales = STORE.sales.filter(s => getDateStr(s.date) === date);
                let totalSales = 0,
                    totalCost = 0,
                    totalProfit = 0;
                daySales.forEach(sale => {
                    const { cost, profit } = calculateSaleProfit(sale);
                    totalSales += sale.total;
                    totalCost += cost;
                    totalProfit += profit;
                });
                return { totalSales, totalCost, totalProfit, count: daySales.length };
            }

            function getPeriodProfit(startDate, endDate) {
                const periodSales = STORE.sales.filter(s => {
                    const sDate = getDateStr(s.date);
                    return sDate >= startDate && sDate <= endDate;
                });
                let totalSales = 0,
                    totalCost = 0,
                    totalProfit = 0;
                periodSales.forEach(sale => {
                    const { cost, profit } = calculateSaleProfit(sale);
                    totalSales += sale.total;
                    totalCost += cost;
                    totalProfit += profit;
                });
                return { totalSales, totalCost, totalProfit, count: periodSales.length };
            }

            // ---------- EXPORT/IMPORT FUNCTIONS ----------
            function exportData() {
                const data = JSON.stringify(STORE, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `HerBusiness_Backup_${todayStr()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('📦 Data exported successfully!');
            }

            function importData(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.settings && data.settings.bizName) {
                            Object.assign(STORE, data);
                            saveData();
                            renderAll();
                            showToast('✅ Data imported successfully!');
                        } else {
                            showToast('❌ Invalid backup file');
                        }
                    } catch (err) {
                        showToast('❌ Error reading file');
                    }
                };
                reader.readAsText(file);
            }

            // ---------- COMPREHENSIVE REPORT GENERATION ----------
            function generateReportHTML(period, startDate, endDate) {
                const sales = STORE.sales.filter(s => {
                    const sDate = getDateStr(s.date);
                    return sDate >= startDate && sDate <= endDate;
                });

                const expenses = STORE.expenses.filter(e => {
                    const eDate = getDateStr(e.date);
                    return eDate >= startDate && eDate <= endDate;
                });

                const totalSales = sales.reduce((a, b) => a + (b.total || 0), 0);
                const totalExpenses = expenses.reduce((a, b) => a + (b.amount || 0), 0);
                
                let totalCost = 0;
                let totalProfit = 0;
                sales.forEach(sale => {
                    const { cost, profit } = calculateSaleProfit(sale);
                    totalCost += cost;
                    totalProfit += profit;
                });
                
                const netProfit = totalProfit - totalExpenses;
                const currency = STORE.settings.currency || 'GH₵';
                const bizName = STORE.settings.bizName || 'My Business';
                const owner = STORE.settings.owner || 'Business Owner';
                const logo = STORE.settings.logo || '';

                const salesByDay = {};
                sales.forEach(s => {
                    const day = getDateStr(s.date);
                    if (!salesByDay[day]) salesByDay[day] = { sales: 0, cost: 0, profit: 0, count: 0 };
                    const { cost, profit } = calculateSaleProfit(s);
                    salesByDay[day].sales += s.total;
                    salesByDay[day].cost += cost;
                    salesByDay[day].profit += profit;
                    salesByDay[day].count += 1;
                });

                const expensesByCategory = {};
                expenses.forEach(e => {
                    expensesByCategory[e.category] = (expensesByCategory[e.category] || 0) + e.amount;
                });

                const paymentMethods = {};
                sales.forEach(s => {
                    paymentMethods[s.payment] = (paymentMethods[s.payment] || 0) + s.total;
                });

                const productSales = {};
                sales.forEach(s => {
                    if (!productSales[s.product]) productSales[s.product] = { revenue: 0, profit: 0, qty: 0 };
                    const { profit } = calculateSaleProfit(s);
                    productSales[s.product].revenue += s.total;
                    productSales[s.product].profit += profit;
                    productSales[s.product].qty += s.qty;
                });
                const topProducts = Object.entries(productSales).sort((a, b) => b[1].revenue - a[1].revenue).slice(0, 5);

                const customerSales = {};
                sales.forEach(s => {
                    if (s.customer && s.customer !== 'Walk-in') {
                        if (!customerSales[s.customer]) customerSales[s.customer] = { revenue: 0, profit: 0, phone: s.customerPhone || '' };
                        const { profit } = calculateSaleProfit(s);
                        customerSales[s.customer].revenue += s.total;
                        customerSales[s.customer].profit += profit;
                    }
                });
                const topCustomers = Object.entries(customerSales).sort((a, b) => b[1].revenue - a[1].revenue).slice(0, 5);

                const outstandingDebts = STORE.debts.filter(d => d.status === 'Outstanding' || d.status === 'Overdue');

            // ---------- helpers ----------
            function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

                if (target) target.classList.add('active');
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                const navBtn = document.querySelector(`.nav-item[data-screen="${screenId}"]`);
                if (navBtn) navBtn.classList.add('active');
                currentScreen = screenId;
                if (screenId === 'dashboard') renderDashboard();
                else if (screenId === 'sales') renderSales();
                else if (screenId === 'expenses') renderExpenses();

            // ---------- REPORT GENERATION BY TYPE ----------
            function generateReportByType(type) {
                const today = new Date();
                let startDate, endDate, periodName;
                
                switch(type) {
                    case 'daily':
                        startDate = today.toISOString().slice(0, 10);
                        endDate = startDate;
                        periodName = 'Daily';
                        break;
                    case 'weekly':
                        const weekStart = getWeekStart();
                        startDate = weekStart.toISOString().slice(0, 10);
                        endDate = today.toISOString().slice(0, 10);
                        periodName = 'Weekly';
                        break;
                    case 'monthly':
                        const monthStart = getMonthStart();
                        startDate = monthStart.toISOString().slice(0, 10);
                        endDate = today.toISOString().slice(0, 10);
                        periodName = 'Monthly';
                        break;
                    default:
                        startDate = today.toISOString().slice(0, 10);
                        endDate = startDate;
                        periodName = 'Daily';
                }
                
                return generateReportHTML(periodName, startDate, endDate);
            }

                        const data = {};

                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">

                </div>
                <div class="modal-actions"><button id="modalCancel" class="btn-outline">Cancel</button><button id="modalSave" class="btn-primary">Save</button></div>`;
                
                openModal(html, (data) => {
                    if (!data.productId) { showToast('Please select a product'); return false; }
                    const qty = parseFloat(data.qty) || 0;
                    const price = parseFloat(data.price) || 0;
                    if (qty < 1) { showToast('Quantity must be at least 1'); return false; }
                    if (price <= 0) { showToast('Price must be greater than 0'); return false; }
                    
                    const product = STORE.products.find(p => p.id === data.productId);
                    if (!product) { showToast('Product not found'); return false; }
                    if (product.qty < qty) { 
                        showToast(`❌ Not enough stock! Only ${product.qty} available.`); 
                        return false; 
                    }
                    
                    const total = qty * price;
                    const cost = product.buyPrice * qty;
                    const profit = total - cost;
                    
                    const customerPhone = data.customerPhone || '';
                    
                    const sale = { 
                        id: d.id || genId(), 
                        product: product.name,
                        productId: product.id,
                        customer: data.customer || 'Walk-in', 
                        customerPhone: customerPhone,
                        qty, 
                        price, 
                        total,
                        cost: cost,
                        profit: profit,
                        payment: data.payment, 
                        date: new Date().toISOString(), 
                        status: data.payment === 'Credit' ? 'Credit' : 'Paid' 
                    };
                    
                    if (sale.payment === 'Credit') {
                        STORE.debts.push({ 
                            id: genId(), 
                            customer: sale.customer, 
                            amount: total, 
                            due: new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10), 
                            status: 'Outstanding', 
                            date: sale.date 
                        });
                    }
                    
                    if (d.id) {
                        const idx = STORE.sales.findIndex(s => s.id === d.id);
                        if (idx >= 0) {
                            const oldSale = STORE.sales[idx];
                            const oldProduct = STORE.products.find(p => p.id === oldSale.productId);
                            if (oldProduct) {
                                oldProduct.qty += oldSale.qty || 0;
                            }
                            STORE.sales[idx] = sale;
                        } else {
                            STORE.sales.push(sale);
                        }
                    } else {
                        STORE.sales.push(sale);
                    }
                    
                    product.qty = Math.max(0, product.qty - qty);
                    
                    saveData();
                    renderAll();
                    return true;
                });
                
                setTimeout(() => {
                    const qtyField = document.getElementById('saleQtyInput');
                    const priceField = document.getElementById('salePriceInput');
                    const productSelect = document.getElementById('saleProductSelect');
                    const totalDisplay = document.getElementById('saleTotalDisplay');
                    const costDisplay = document.getElementById('saleCostDisplay');
                    const profitDisplay = document.getElementById('saleProfitDisplay');
                    
                    function updateTotals() {
                        const qty = parseFloat(qtyField?.value) || 0;
                        const price = parseFloat(priceField?.value) || 0;
                        const productId = productSelect?.value;
                        const product = STORE.products.find(p => p.id === productId);
                        
                        const total = qty * price;
                        const cost = product ? product.buyPrice * qty : 0;
                        const profit = total - cost;
                        
                        if (totalDisplay) totalDisplay.textContent = `${currency()}${total.toFixed(2)}`;
                        if (costDisplay) costDisplay.textContent = `${currency()}${cost.toFixed(2)}`;
                        if (profitDisplay) {
                            profitDisplay.textContent = `${currency()}${profit.toFixed(2)}`;
                            profitDisplay.style.color = profit >= 0 ? '#1d6f44' : '#b13e3e';
                        }
                    }
                    
                    if (qtyField) qtyField.addEventListener('input', updateTotals);
                    if (priceField) priceField.addEventListener('input', updateTotals);
                    
                    if (productSelect) {
                        productSelect.addEventListener('change', function() {
                            const selectedProduct = STORE.products.find(p => p.id === this.value);
                            if (selectedProduct && priceField) {
                                priceField.value = selectedProduct.sellPrice;
                                updateTotals();
                            }
                        });
                    }
                    
                    updateTotals();
                }, 100);
            }

            function renderDashboard() {
                const today = todayStr();
                const weekStart = getWeekStart().toISOString().slice(0, 10);
                const monthStart = getMonthStart().toISOString().slice(0, 10);
                
                const todayData = getDailySalesProfit(today);
                const todayExpenses = STORE.expenses.filter(e => getDateStr(e.date) === today).reduce((a, b) => a + b.amount, 0);
                const todayNetProfit = todayData.totalProfit - todayExpenses;
                
                const weekData = getPeriodProfit(weekStart, today);
                const weekExpenses = STORE.expenses.filter(e => {
                    const eDate = getDateStr(e.date);
                    return eDate >= weekStart && eDate <= today;
                }).reduce((a, b) => a + b.amount, 0);
                const weekNetProfit = weekData.totalProfit - weekExpenses;
                
                const monthData = getPeriodProfit(monthStart, today);
                const monthExpenses = STORE.expenses.filter(e => {
                    const eDate = getDateStr(e.date);
                    return eDate >= monthStart && eDate <= today;
                }).reduce((a, b) => a + b.amount, 0);
                const monthNetProfit = monthData.totalProfit - monthExpenses;
                
                const totalDebt = STORE.debts.reduce((a, b) => a + b.amount, 0);
                
                document.getElementById('dashStats').innerHTML = `
                <div class="stat-card"><div class="label">Today's Sales</div><div class="value">${currency()}${todayData.totalSales.toFixed(2)}</div></div>
                <div class="stat-card"><div class="label">Today's Expenses</div><div class="value">${currency()}${todayExpenses.toFixed(2)}</div></div>
                <div class="stat-card"><div class="label">Today's Net Profit</div><div class="value ${todayNetProfit >= 0 ? 'profit-positive' : 'profit-negative'}">${currency()}${todayNetProfit.toFixed(2)}</div></div>
                <div class="stat-card"><div class="label">Customer Debt</div><div class="value">${currency()}${totalDebt.toFixed(2)}</div></div>
                <div class="stat-card"><div class="label">Weekly Net Profit</div><div class="value ${weekNetProfit >= 0 ? 'profit-positive' : 'profit-negative'}">${currency()}${weekNetProfit.toFixed(2)}</div></div>
                <div class="stat-card"><div class="label">Monthly Net Profit</div><div class="value ${monthNetProfit >= 0 ? 'profit-positive' : 'profit-negative'}">${currency()}${monthNetProfit.toFixed(2)}</div></div>
                `;
                
                const days = [];
                for (let i = 6; i >= 0; i--) { 
                    const d = new Date(); 
                    d.setDate(d.getDate() - i); 
                    days.push(d.toISOString().slice(0, 10)); 
                }
                const bars = days.map(day => {
                    const dayData = getDailySalesProfit(day);
                    const dayExpenses = STORE.expenses.filter(e => getDateStr(e.date) === day).reduce((a, b) => a + b.amount, 0);
                    return dayData.totalProfit - dayExpenses;
                });
                const max = Math.max(1, ...bars.map(Math.abs));
                document.getElementById('chartBars').innerHTML = bars.map((v, i) => {
                    const height = Math.max(5, (Math.abs(v) / max) * 50);
                    const color = v >= 0 ? '#1d6f44' : '#b13e3e';
                    return `<div class="bar-item">
                        <div class="bar" style="height:${height}px; background:${color};"></div>
                        <div class="bar-label">${days[i].slice(5)}</div>
                    </div>`;
                }).join('');
            }

                const monthNetProfit = monthData.totalProfit - monthExpenses;
                
                let html =
                    `<div class="stat-card"><div class="label">Monthly Sales Goal (${currency()})</div><div class="value">${currency()}${(g.monthlySales||0).toFixed(0)}</div><div class="sub">Current: ${currency()}${monthData.totalSales.toFixed(2)}</div><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, (monthData.totalSales/(g.monthlySales||1))*100)}%"></div></div></div>`;
                html +=
                    `<div class="stat-card"><div class="label">Monthly Profit Goal (${currency()})</div><div class="value">${currency()}${(g.monthlyProfit||0).toFixed(0)}</div><div class="sub">Current: ${currency()}${monthNetProfit.toFixed(2)}</div><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, (monthNetProfit/(g.monthlyProfit||1))*100)}%"></div></div></div>`;
                html +=
                    `<div class="stat-card"><div class="label">Savings Target (${currency()})</div><div class="value">${currency()}${(g.savings||0).toFixed(0)}</div></div>`;
                document.getElementById('goalsDisplay').innerHTML = html;
            }

            function renderReminders() {
                const container = document.getElementById('remindersList');
                if (!STORE.reminders.length) { container.innerHTML =
                    `<div class="empty-state">No reminders set.</div>`; return; }
                container.innerHTML = STORE.reminders.map(r =>
                    `<div class="list-item"><div class="info"><strong>${r.title}</strong><span class="meta">${r.date} ${r.time||''}</span></div><span class="badge ${r.completed?'success':''}">${r.completed?'✅ Done':'⏳'}</span></div>`
                    ).join('');
            }

            function renderReports() {
                const reportHTML = `
                <div style="margin-bottom:12px;">
                    <label style="font-weight:600; display:block; margin-bottom:6px;">Select Report Type</label>
                    <div class="report-type-selector">
                        <div class="report-type-btn active" data-type="daily" onclick="selectReportType('daily')">
                            <i class="fas fa-calendar-day"></i>
                            Daily
                        </div>
                        <div class="report-type-btn" data-type="weekly" onclick="selectReportType('weekly')">
                            <i class="fas fa-calendar-week"></i>
                            Weekly
                        </div>
                        <div class="report-type-btn" data-type="monthly" onclick="selectReportType('monthly')">
                            <i class="fas fa-calendar-alt"></i>
                            Monthly
                        </div>
                    </div>
                </div>
                <div class="report-actions">
                    <button class="btn-primary" id="viewReportBtn"><i class="fas fa-eye"></i> Generate Report</button>
                    <button class="btn-secondary" id="printReportBtn"><i class="fas fa-print"></i> Print Report</button>
                </div>
                <div id="reportPreview" style="background:#faf8fd; border-radius:20px; padding:16px; margin-top:12px; border:1px solid #ede7f5; max-height:500px; overflow-y:auto;">
                    <p style="color:#6b5f7a; text-align:center;">Select a report type and click "Generate Report" to see all financial details</p>
                    <p style="color:#6b5f7a; text-align:center; font-size:12px;">${STORE.sales.length} sales and ${STORE.expenses.length} expenses recorded</p>
                </div>
                <div class="ad-placeholder"><i class="fas fa-ad"></i> Advertisement</div>
                `;
                document.getElementById('reportsContent').innerHTML = reportHTML;

                // Report type selection
                window.selectReportType = function(type) {
                    document.querySelectorAll('.report-type-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    document.querySelector(`.report-type-btn[data-type="${type}"]`)?.classList.add('active');
                };

                document.getElementById('viewReportBtn')?.addEventListener('click', function() {
                    const activeBtn = document.querySelector('.report-type-btn.active');
                    const type = activeBtn?.dataset?.type || 'daily';
                    const html = generateReportByType(type);
                    document.getElementById('reportPreview').innerHTML = html;
                    showToast('📊 Report generated!');
                });

                document.getElementById('printReportBtn')?.addEventListener('click', function() {
                    const activeBtn = document.querySelector('.report-type-btn.active');
                    const type = activeBtn?.dataset?.type || 'daily';
                    const html = generateReportByType(type);
                    const win = window.open('', '_blank');
                    win.document.write(html);
                    win.document.close();
                    setTimeout(() => { win.print(); }, 500);
                    showToast('🖨️ Print dialog opening...');
                });
            }

            function renderSettings() {
                const s = STORE.settings;
                const currentCurrency = s.currency || 'GH₵';
                const currencyDisplay = CURRENCIES.find(c => c.symbol === currentCurrency);
                
                document.getElementById('settingsContent').innerHTML = `
                <div class="stat-card"><div class="label">Business</div><div class="value">${s.bizName||''}</div><div class="sub">${s.owner||''} · ${s.bizType||''}</div></div>
                <div class="stat-card"><div class="label">Logo</div><div><button class="quick-btn" onclick="openLogoModal()"><i class="fas fa-image"></i> ${s.logo ? 'Change Logo' : 'Upload Logo'}</button></div></div>
                <div class="stat-card"><div class="label">Currency</div><div class="value">${currencyDisplay ? currencyDisplay.flag + ' ' + currentCurrency : currentCurrency}</div><div><button class="quick-btn" onclick="openCurrencySelector()"><i class="fas fa-exchange-alt"></i> Change Currency</button></div></div>
                <div class="stat-card"><div class="label">Data Backup</div><div><button class="quick-btn" onclick="showBackupOptions()"><i class="fas fa-cloud-upload-alt"></i> Backup & Restore</button></div></div>
                <div class="stat-card"><div class="label">About</div><div class="sub">HerBusiness v2.0 · Complete Profit Tracking</div></div>
                <button class="btn-danger" style="width:100%; padding:14px; border-radius:60px; border:none; font-weight:600; margin-top:12px;" id="clearData">Clear all data</button>
                `;
                
                document.getElementById('clearData')?.addEventListener('click', function() {
                    if (confirm('Delete all business data? This cannot be undone.')) {
                        STORE.sales = [];
                        STORE.expenses = [];
                        STORE.customers = [];
                        STORE.products = [];
                        STORE.debts = [];
                        STORE.reminders = [];
                        STORE.goals = {};
                        STORE.settings.logo = null;
                        saveData();
                        renderAll();
                        showToast('Data cleared');
                    }
                });
            }

            // initial render
            renderAll();
            navigateTo('dashboard');

            // Expose functions globally
            window.showBackupOptions = showBackupOptions;
            window.exportData = exportData;
            window.importData = importData;
            window.generateReportHTML = generateReportHTML;
            window.generateReportByType = generateReportByType;
            window.openLogoModal = openLogoModal;
            window.openCurrencySelector = openCurrencySelector;
            window.selectCurrency = selectCurrency;
            window.selectReportType = selectReportType;
            window.editProduct = editProduct;
            window.deleteProduct = deleteProduct;

            // Auto-backup every 5 minutes
            setInterval(() => {
                saveData();
            }, 300000);

            // Backup on page close
            window.addEventListener('beforeunload', function() {
                saveData();
            });

        })();
    </script>
</body>
</html>
